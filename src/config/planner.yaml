# AgentQuant planner configuration for China futures.
exp_name: "agentquant-planner-future"

# Trading settings. Keep this aligned with dev.yaml so planner-mode experiments
# do not accidentally run a three-ticker subset.
cashflow: 100000
market_type: "china_futures"
tickers:
  - BU
  - C
  - CF
  - EB
  - HC
  - I
  - J
  - M
  - MA
  - P
  - PB
  - RB
  - SR
  - TA
  - ZN

# true: run planner agent, choose from workflow_analysts.
planner_mode: true
workflow_analysts:
  - commodity_news
  - fundamental
  - technical
# Keep policy/macroeconomic available in codebase, but exclude them until they
# are rebuilt as stable futures-only analysts.

# LLM model settings, refer to llm/inference.py: LLMConfig.
llm:
  provider: "CodexOpenAI"
  model: "gpt-5.5"
  structured_output_method: "json_mode"
  failure_policy:
    parse_error: "retry_then_default"
    rate_limit: "retry_with_backoff"
    auth_error: "raise"
    invalid_request: "raise"
    server_error: "retry_then_default"
  deepseek:
    thinking:
      enabled: false
    reasoning_effort: null
  codex_openai:
    reasoning_effort: "medium"
