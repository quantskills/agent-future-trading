# 分析师冷启动先验目录。
# 本文件不是“静态加权开仓规则”，也不是收益调参捷径。
# 它只在学习样本不足时提供默认业务常识：技术面偏日频触发，
# 基本面偏中期背景，新闻偏事件催化/风险。
#
# 运行时由 config_normalizer.py 展开到 PM 需要的冷启动先验位置：
# - portfolio_manager.sector_weights
# - portfolio_manager.strategic_view_weights
# - analyst_applicability_profile
#
# 最终交易权限必须来自 PM 的 action evidence router：
# 技术/事件触发、失效边界、市场确认、action-value 和风险约束。
# 静态先验不能直接生成 open/add/hold/reduce/exit/conditional_monitor/execution 动作偏好，也不能直接生成最终交易合约。

dynamic_bounds:
  min_weight: 0.05
  max_weight: 0.70

applicability_profile:
  # 分析师适用性校准：只作为上下文和信号质量调整的冷启动先验。
  # 它用于解释“哪个分析师在什么场景更有参考价值”，不是手工交易规则，
  # 也不是最终交易权限。
  enabled: true
  technical:
    default_horizon: short
    horizon_multipliers: {short: 1.15, medium: 0.90, long: 0.75, event_short: 1.00}
    sector_multipliers: {energy: 1.00, chemical: 1.00, ferrous: 1.00, nonferrous: 1.00, agricultural: 0.95}
    market_regime_multipliers: {trending: 1.15, ranging: 0.90, reversal: 1.05}
  fundamental:
    default_horizon: medium
    horizon_multipliers: {short: 0.85, medium: 1.20, long: 1.10, event_short: 0.80}
    sector_multipliers: {energy: 1.00, chemical: 1.10, ferrous: 1.10, nonferrous: 1.00, agricultural: 1.05}
    market_regime_multipliers: {trending: 1.05, ranging: 1.10, reversal: 0.95}
  commodity_news:
    default_horizon: event_short
    event_window_days: 3
    outside_event_window_multiplier: 0.60
    horizon_multipliers: {short: 1.00, medium: 0.75, long: 0.60, event_short: 1.25}
    sector_multipliers: {energy: 1.05, chemical: 1.00, ferrous: 1.00, nonferrous: 1.05, agricultural: 1.15}
    market_regime_multipliers: {event_driven: 1.20, trending: 0.95, ranging: 0.90, reversal: 1.05}

profiles:
  # 仅用于中期方向背景、持仓背景和冷启动排序。
  # 不能直接生成日频新开仓权限。
  sector_strategic_view:
    sector_weights:
      energy: {technical: 0.35, fundamental: 0.45, commodity_news: 0.20}
      chemical: {technical: 0.30, fundamental: 0.50, commodity_news: 0.20}
      ferrous: {technical: 0.30, fundamental: 0.50, commodity_news: 0.20}
      nonferrous: {technical: 0.35, fundamental: 0.35, commodity_news: 0.30}
      agricultural: {technical: 0.25, fundamental: 0.45, commodity_news: 0.30}
      generic: {technical: 0.35, fundamental: 0.40, commodity_news: 0.25}

  # 仅用于日频冷启动排序和质量上下文。
  # 最终 PM 权限来自动作证据，不来自这些权重。
  daily_trade_timing:
    sector_weights:
      energy: {technical: 0.50, fundamental: 0.30, commodity_news: 0.20}
      chemical: {technical: 0.55, fundamental: 0.30, commodity_news: 0.15}
      ferrous: {technical: 0.55, fundamental: 0.30, commodity_news: 0.15}
      nonferrous: {technical: 0.50, fundamental: 0.25, commodity_news: 0.25}
      agricultural: {technical: 0.45, fundamental: 0.30, commodity_news: 0.25}
      generic: {technical: 0.50, fundamental: 0.30, commodity_news: 0.20}

