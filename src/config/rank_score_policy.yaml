# Rank score policy catalog.
#
# This catalog tunes only the single full-market capital rank score. It does
# not define position size, margin floors, hard risk gates, trade authority, or
# product blacklists. Defaults below mirror the previous code constants so
# adding this catalog does not change current behavior by itself.

rank_score_policy:
  rank_score:
    cold_start_evidence_quality: 0.52
    capital_layer_priority:
      tradeable_candidate: 0.18
      probe_candidate: 0.10
      watch_for_trigger: 0.02
      no_opportunity: 0.00

    open_add_action_value_delta:
      max_abs_delta: 0.35
      positive_learning_signal: 0.18
      trigger_quality_positive_signal: 0.08
      negative_learning_signal: -0.18
      recent_tail_loss_signal: -0.14
      entry_quality_loss_signal: -0.16
      net_trigger_quality_loss_signal: -0.10

    trigger_execution_quality:
      trigger_quality_positive_bonus: 1.00
      trigger_quality_loss_penalty: 1.00

    product_setup_trigger_history:
      alpha_profile_adjustment: 1.00

    capital_efficiency:
      enabled: true
      max_bonus: 0.02

    conflict_risk_invalidation_penalty:
      fusion_score_adjustment: 1.00
      market_conflict_penalty: 1.00
      critical_data_gap_penalty: 1.00
      fundamental_gap_penalty: 1.00
      gating_failure_penalty_per_item: 0.025
      gating_failure_penalty_cap: 0.16
