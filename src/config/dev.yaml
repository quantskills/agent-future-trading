# AgentQuant futures development configuration.
# 本文件用于 15 个期货品类的回测、模拟盘和实盘复刻流程。
# 调参原则：硬风控、交易宇宙、数据源和 LLM 路由由本文件人工控制；
# 每日会变化的弱参由 reviewer 写入数据库 overlay。新一轮 6+ 个月回测的资金利用率
# 目标为保证金占账户权益/本金的 16%-20%；若强模板/确认不足，系统只记录容量不足，
# 不允许用 weak/watchlist 信号硬凑仓位。

# ---------------------------------------------------------------------------
# 1. Experiment and Account
# ---------------------------------------------------------------------------

exp_name: "agentquant-futures-trading-2025"
cashflow: 5000000
market_type: "china_futures"

# 组合保证金绝对硬闸，不是资金利用目标。
# 常规资金部署上限由 capital_utilization_control.max_margin_ratio_after_scaling=0.20 控制；
# 这里保留 25% 作为滑点、换月和日内保证金口径漂移的最后安全边界。
max_total_margin_ratio: 0.25

risk_control:
  # 按账户权益 / 初始资金划分风险状态。
  warning_ratio: 0.70
  danger_ratio: 0.50
  emergency_ratio: 0.30

  # 风险状态下对目标仓位的缩放。
  position_scaling:
    safe: 1.0
    warning: 0.6
    danger: 0.3

  # 单品种名义敞口上限，不是保证金占用上限。
  max_single_position_ratio:
    safe: 0.12
    warning: 0.08
    danger: 0.05

net_exposure_control:
  # 限制组合多空净方向暴露。
  max_net_exposure: 0.50
  symmetric_scaling: true

# ---------------------------------------------------------------------------
# 2. Data Quality and Market Confirmation
# ---------------------------------------------------------------------------

fundamental_quality_control:
  # 本地 Finoview 基本面数据覆盖率、陈旧率、缺失率较差时，
  # 下调 fundamental 分析师权重，而不是让缺失数据形成强判断。
  enabled: true
  min_coverage_ratio: 0.65
  stale_ratio_warn: 0.20
  stale_ratio_severe: 0.35
  missing_ratio_warn: 0.20
  missing_ratio_severe: 0.40
  low_coverage_multiplier: 0.70
  stale_warn_multiplier: 0.85
  stale_severe_multiplier: 0.65
  missing_warn_multiplier: 0.85
  missing_severe_multiplier: 0.65
  min_multiplier: 0.25

pandaai_extra_data:
  # PandaAI 扩展期货数据：进入 fundamental 分析师的结构化因子上下文，
  # 同时进入 PM/Auditor 的盘前确认、过滤和仓位缩放；不单独生成交易信号。
  enabled: true
  mode: confirm_and_factor_context
  reference_lag_days: 1
  lookback_days: 5
  fail_policy: soft_skip
  use_in_fundamental_analyst: true
  features:
    # 默认启用：已实测可用，且适合做盘前确认。
    basis: true
    warehouse_receipt: true
    net_flow: true
    variety_position_rank: true
    symbol_position_rank: true
    ls_ratio: true
    broker_net_margin_change: true
    broker_variety_profit: true
    netposi_rank: true
    net_cap_change: true
    contract_daily_indicators: true
    contract_rank: true

    # 默认关闭：接口可用但耗时更长，避免大规模回测被拖慢。
    broker_net_margin: false
  fundamental_features:
    # fundamental 分析师读取的 PandaAI 因子集合。与 features 分开，便于后续按成本单独裁剪。
    basis: true
    warehouse_receipt: true
    net_flow: true
    variety_position_rank: true
    symbol_position_rank: true
    ls_ratio: true
    broker_net_margin_change: true
    broker_variety_profit: true
    netposi_rank: true
    contract_daily_indicators: true
    contract_rank: true
    broker_net_margin: false
    net_cap_change: true

market_confirmation:
  # 根据 PandaAI 扩展数据，对 Phase1 目标方向做确认、缩放或阻断。
  enabled: true
  min_confirmations_for_new_entry: 2
  min_confirmation_score_for_new_entry: 0.55
  min_confirmation_score_for_weak_combo: 0.60
  max_conflicts_for_new_entry: 4
  quality_gate_enabled: true
  quality_gate_cap_multiplier: 0.50
  quality_gate_block_weak_signal: true
  weak_signal_strength: 0.25
  conflict_cap_multiplier: 0.50
  block_weak_conflicting_signal: true
  allow_conflicted_probe_with_strong_confirmation: true
  conflicted_probe_min_confirmation_score: 0.65
  conflicted_probe_min_confirmations: 3

# ---------------------------------------------------------------------------
# 3. Auditor, Feedback, and Learned Trade-Frequency Rules
# ---------------------------------------------------------------------------

trade_auditor:
  # 当前交易计划审核智能体。它不调用 LLM，不下单，不算最终手数；
  # 它只在 portfolio_manager 资金配置前判断交易计划质量。
  enabled: true
  mode: deterministic
  use_llm: false
  learning_mode: audit_only
  policy_version: deterministic_v1

  quality_gate:
    # 三分析师质量门槛：主要限制新开仓和加仓，不阻断必要平仓、减仓、换月和强制风控。
    enabled: true
    min_supporting_analysts: 2
    block_low_tradeability_count: 2
    conflict_block_confirmation_below: 0.50
    no_support_block_confirmation_below: 0.70
    medium_quality_multiplier: 0.50
    # 不再在 dev.yaml 固化品种-方向保护/压制名单；强弱模板由
    # strategy_memory 与 reviewer 写入的 adaptive_policy_state 自动读取。
    qualified_support_min_confidence: 0.45
    news_driver_control:
      enabled: true
      min_news_confidence: 0.60
      min_market_confirmation_score: 0.60
      min_freshness_score: 0.70
      min_relevance_score: 0.70
      block_when_core_opposes: true
      cap_without_fundamental_confirmation: true
      cap_multiplier: 0.50

  attribution_feedback:
    # 基于已平仓交易的历史反馈。当前只审计和降权，不训练强化学习策略。
    enabled: true
    lookback_trades: 30
    min_samples_soft: 3
    min_samples_hard: 6
    weak_win_rate_below: 0.40
    severe_win_rate_below: 0.30
    weak_total_pnl_below: -1500
    severe_total_pnl_below: -5000
    weak_combo_requires_confirmation_score: 0.60
    block_severe_negative_combo: true

  cold_start:
    # 冷启动控制：历史样本不足时不直接禁入，而是先用小仓试探。
    # 最新回测中 cold_start_small_cap 触发过多，因此适度放宽初始仓位乘数，
    # 减少对强模板和持仓延续方向的误伤，但仍保留“先验证、后放大”的原则。
    policy: small_cap
    # 冷启动仓位乘数：从 0.50 放宽到 0.65，减少强模板和持仓延续方向被过度压缩。
    max_position_ratio_multiplier: 0.65
    block_weak_combo_new_entries: true
    # 只有在 PandaAI 确认明显偏弱时，才因“冲突 + 冷启动”直接拦截。
    block_conflict_confirmation_below: 0.60

  audit:
    # 输出到 recommendation.signal_snapshot.pre_open_plan.trade_auditor。
    write_to_signal_snapshot: true
    log_decision_reasons: true

trade_frequency_control:
  # 保留通用历史样本阈值作为冷启动先验和 DB 反馈保护。
  # 不再在 dev.yaml 固化品种方向 cap 或弱信号组合名单；
  # 每日弱参调整来自 reviewer 写入的 config_learning_overlay / adaptive_policy_state。
  enabled: true
  lookback_trades: 20
  min_completed_trades: 6
  weak_win_rate_below: 0.38
  severe_win_rate_below: 0.30
  weak_total_pnl_below: -1500
  severe_total_pnl_below: -5000
  weak_cap_multiplier: 0.50
  severe_block_new_entries: true

ticker_performance_control:
  # 品种级历史表现控制：根据最近日度品种 PnL 对弱势品种降 cap。
  enabled: true
  lookback_days: 20
  min_trade_days: 3
  soft_avg_pnl_below: -300
  soft_cap_multiplier: 0.50
  hard_avg_pnl_below: -800
  hard_win_rate_below: 0.35
  hard_cap_ratio: 0.03
  recovery_avg_pnl_above: 200
  recovery_cap_multiplier: 1.10

drawdown_control:
  # 回撤扩大时降低新仓；硬回撤触发后进入 reduce-only。
  enabled: true
  soft_drawdown: 0.015
  hard_drawdown: 0.025
  soft_cap_multiplier: 0.70
  hard_reduce_only: true

ticker_loss_control:
  # 防止某个品种在短窗口内连续拖累组合。
  enabled: true
  lookback_days: 5
  loss_threshold: -3000
  cap_multiplier: 0.50
  block_new_entries_after_consecutive_losses: 2

strategy_memory:
  # 数据库驱动的实时策略记忆。
  # 每天 Phase4 完成后，基于已经完成的开平仓交易对刷新记忆；
  # 下一交易日由 Phase1 / auditor 读取，用来保护强模板、压制弱模板。
  # 记忆只写数据库，不自动改配置文件，避免把短期噪声固化进 dev.yaml。
  enabled: true
  # 每天 Phase4 完成后刷新数据库记忆，下一交易日再被 auditor 读取。
  update_on_phase4: true
  source: attribution_auto
  lookback_trades: 30
  expires_after_days: 30
  min_samples_watchlist: 2
  min_samples_weak_block: 4
  min_samples_protected: 3
  protected_win_rate: 0.60
  protected_total_pnl: 1000
  watchlist_win_rate_below: 0.45
  watchlist_total_pnl_below: -500
  weak_block_win_rate_below: 0.30
  weak_block_total_pnl_below: -2500
  audit:
    # protected：已验证强模板，更容易保留和延续。
    protected_min_confirmation_score: 0.45
    protected_multiplier: 0.65
    # watchlist：偏弱模板仍压仓，但不再过度苛刻。
    watchlist_min_confirmation_score: 0.55
    watchlist_cap_multiplier: 0.50
    # weak_block：仍保持严格，但把确认分放松到 0.60，避免误杀边缘有效模板。
    weak_block_min_confirmation_score: 0.60
    weak_block_cap_multiplier: 0.35
    # 暂时保持 2，不全局放松到 1，避免弱模板同时放宽过头。
    min_qualified_supporters: 2

learning:
  # 自动学习边界：学习层只调整弱参、模板权重、分析师摘要和软风控 overlay；
  # 不训练模型、不改 LLM 权重、不自动改 provider/model，也不突破硬风控。
  enabled: true
  memory_expires_after_days: 30
  overlay_expires_after_days: 10
  anti_overfit:
    min_samples_for_template: 3
    min_samples_for_policy: 4
  config_overlay:
    # reviewer 写入 config_learning_overlay，下一交易日由 portfolio_manager 按 allowlist 读取。
    # dev.yaml 保留硬风控、数据源、LLM 路由和冷启动先验，不再承载每日波动弱参。
    enabled: true
  adaptive_policy:
    # 由成熟模板表现生成 protect/cap 等软策略，供 auditor 读取。
    enabled: true
    min_policy_confidence: 0.35
  template_prior:
    enabled: true
    load_on_backtest_start: true
    export_on_backtest_end: true
    path: src/logs/attribution/template_prior.json
  provisional_policy_state:
    enabled: true
    anomaly_loss_cap_enabled: true
    anomaly_loss_threshold: -8000
    anomaly_loss_cap_multiplier: 0.25
    consecutive_loss_probe_only_threshold: 2
    consecutive_loss_multiplier: 0.35
    valid_days: 10
  reviewer_causal_review:
    enabled: true
    use_llm: true
    run_after_phase4_settlement: true
    evidence_pack_no_lookahead: true
    separate_pre_trade_evidence_and_post_trade_outcome: true
    write_raw_llm_to_notes_only: true
    rule_engine_required_for_apply: true
    prohibit_direct_llm_trade_authority: true

agent_contracts:
  enabled: true
  runtime_framework: langgraph_phase_flow
  migrate_to_a2a_protocol: false
  adopt_a2a_contract_principles: true
  prohibit_free_text_as_control_input: true
  require_contract_version: true
  require_artifact_validation: true
  require_no_lookahead_header: true
  require_source_artifact_trace: true
  artifact_types:
    analyst_signal: AnalystSignalArtifact
    pm_decision: PMDecisionArtifact
    audit_verdict: AuditVerdictArtifact
    execution: ExecutionArtifact
    settlement: SettlementArtifact
    reviewer_attribution: ReviewerAttributionArtifact
    reviewer_learning: ReviewerLearningArtifact
    causal_review_candidate: CausalReviewCandidateArtifact
  contract_tests:
    enabled: true
    fixture_dir: src/tests/fixtures/agent_contracts
    run_before_backtest: true

analyst_business_quality:
  enabled: true
  min_score_for_probe: 0.45
  min_score_for_deployable: 0.60
  min_score_for_protected: 0.75
  confidence_capped_by_business_quality: true
  require_primary_driver: true
  require_counter_evidence: true
  require_reward_risk_ratio: true
  require_horizon_match: true
  low_quality_action: observe_or_block
  probe_multiplier: 0.25
  low_quality_multiplier: 0.0

llm_signal_quality:
  # Neutral 是合法信号，但不能成为分析师逃避责任的默认出口。
  # 分析师输出 Neutral 时必须说明中性原因、缺失证据、冲突因素和转向条件，
  # reviewer 后续会归因“正确观望”还是“错失机会”。
  neutral_accountability:
    enabled: true
    allow_neutral_signal: true
    require_neutral_reason: true
    required_neutral_fields:
      - neutral_reason
      - missing_evidence
      - conflicting_factors
      - would_change_view_if
    allowed_neutral_reasons:
      - insufficient_evidence
      - factor_conflict
      - data_missing
      - range_bound
      - horizon_conflict
      - reward_risk_insufficient
    reviewer_must_attribute_missed_opportunity: true
  model_bakeoff:
    # 模型 bakeoff 只在正式回测前用固定样本离线执行；
    # 回测过程中不得根据短期收益自动切换 provider/model。
    enabled: true
    run_during_backtest: false
    fixed_eval_set_path: src/logs/attribution/llm_signal_bakeoff_set.json
    compare_neutral_accountability: true
    compare_structured_field_validity: true
    compare_cost_latency: true
    selected_model_written_to_config_only: true

factor_data:
  # 本地数据源入口。dev.yaml 只指定目录和门槛；
  # 字段到业务因子组的映射放在 finoview_factor_catalog.yaml，避免 422 个字段塞进主配置。
  finoview_enabled: true
  data_dir: data/Fundamental_data/Finoview_data
  catalog_path: src/config/finoview_factor_catalog.yaml
  no_lookahead_snapshot: true
  freshness_gate: true
  unknown_factor_trade_weight: 0.0
  priority_tickers:
    phase1_alpha_core: [I, BU, EB, J, SR]
    phase2_weak_or_disputed: [P, ZN, PB, M, C, RB, MA]
  news:
    enabled: true
    data_dir: data/News_data/Future_news
    pre_open_only: true
    require_fundamental_or_pandaai_confirmation_for_large_position: true

learning_context:
  # 分析师提示词只注入 top-k 成熟摘要，避免随着回测天数无限累加 prompt。
  enabled: true
  max_items_per_prompt: 5
  max_chars_per_prompt: 1200
  # 先查同品种；同品种没有成熟摘要时，允许回退到同板块同分析师的成熟摘要。
  # 不默认启用全局跨板块 fallback，避免把不相关品种经验硬塞进 prompt。
  allow_cross_ticker_sector_fallback: true
  allow_global_fallback: false
  allow_wildcard_sector_cross_ticker: false

capital_utilization_control:
  # 目标口径是“保证金占账户权益/本金比例”，不是固定金额。
  # 本轮 6+ 个月回测资金利用目标：把真实高质量 alpha 容量推到 16%-20%。
  # 若强模板/确认不足，系统应在 capital_deployment_state 中记录容量不足原因桶，
  # 不得用 weak/watchlist 信号硬凑仓位。
  enabled: true
  target_margin_ratio_min: 0.16
  target_margin_ratio_max: 0.20
  target_margin_ratio_confirmed: 0.18
  strong_opportunity_target_margin_ratio_min: 0.16
  strong_opportunity_target_margin_ratio_max: 0.20
  max_margin_ratio_after_scaling: 0.20
  # 资金补足只释放给确认度合格的方向；0.60 与市场确认弱模板门槛保持一致。
  min_confirmation_score_for_scaling: 0.60
  lookback_trades_for_scaling: 12
  # 这些最近表现阈值只在 scale_only_when_recent_pnl_positive=true 时启用。
  # 当前由 reviewer 的模板表现和 adaptive_policy_state 负责日度学习，
  # 因此不再把“已有正收益样本”作为资金释放的硬前置，避免冷启动阶段长期低利用率。
  min_completed_trades_for_scaling: 0
  min_recent_win_rate_for_scaling: 0.50
  min_recent_total_pnl_for_scaling: 0
  scale_only_when_recent_pnl_positive: false
  # 如果 reviewer/strategy_memory 已把某个 ticker-side/template 标成 protected，
  # 或 adaptive_policy 给出 protect/allow，资金补足可以绕过普通弱组合/静态 cap 的
  # “不放大”限制，但仍必须满足市场确认、单品种上限、净敞口和保证金硬风控。
  allow_memory_protected_scaling: true
  allow_recovering_template_scaling: false
  memory_protected_min_confirmation_score: 0.45
  allow_confirmed_same_side_add_on: true
  same_side_add_on_match_tolerance: 0.0005

directional_override_control:
  enabled: true
  allow_high_quality_short: true
  min_short_score: 0.45
  min_short_confidence: 0.55
  min_short_strength: 0.30
  min_short_edge: 0.08
  short_probe_max_ratio: 0.03

# ---------------------------------------------------------------------------
# 4. Portfolio Manager and Position Rebalancing
# ---------------------------------------------------------------------------

portfolio_manager:
  # 投资组合经理只调用云端主模型；市场自适应能力由动态融合、质量门槛、
  # auditor 和持仓再平衡控制共同实现。
  llm_mode: cloud_only
  # null inherits llm.model; set a model here only when portfolio manager needs an override.
  # cloud_model: "gpt-5.5"
  # cloud_model: "deepseek-v4-flash"
  # cloud_model: "openai/gpt-5.5"
  cloud_model: null

  holding_rebalance_control:
    # 持仓周期与仓位再平衡控制层。
    # 核心思想：technical 看短线时机，fundamental 做中期锚，
    # commodity_news 只在高质量事件冲击时改变仓位。
    enabled: true
    min_rebalance_ratio: 0.008
    min_new_entry_ratio: 0.004
    max_daily_reduction_ratio: 0.40
    reverse_min_signal_strength: 0.55
    reverse_min_confirmation_score: 0.65
    exit_min_signal_strength: 0.35
    exit_min_confirmation_score: 0.45
    min_fundamental_anchor_confidence: 0.40
    min_fundamental_anchor_business_quality: 0.55
    min_signal_support_confidence: 0.35
    fundamental_anchor_tradeability: [high, medium]
    news_override_tradeability: high
    news_override_min_confidence: 0.60
    news_override_min_freshness: 0.70
    news_override_min_relevance: 0.70
    position_lifecycle:
      enabled: true
      trend_min_profit_ratio: 0.03
      trend_min_confirmation_score: 0.60
      trend_min_signal_strength: 0.30
      failed_loss_ratio: -0.05
      failed_max_confirmation_score: 0.45
      probe_max_hold_days: 2
      probe_min_profit_ratio: 0.01
      probe_min_confirmation_score: 0.55
    min_hold_days_by_sector:
      energy: 3
      chemical: 5
      ferrous: 5
      nonferrous: 4
      agricultural: 7
      generic: 4

  adaptive_fusion:
    enabled: true
    sector_weight: 0.40

  quality_aware_fusion:
    enabled: true
    tradeability_multipliers:
      high: 1.00
      medium: 0.65
      low: 0.15
      unknown: 0.75
    confidence_caps:
      high: 1.00
      medium: 0.65
      low: 0.35
      unknown: 0.55
    severe_risk_flag_multiplier: 0.80
    min_quality_multiplier: 0.05

  sector_weights:
    # 不同期货大类采用不同分析侧重。
    energy: {technical: 0.40, fundamental: 0.40, commodity_news: 0.20}
    chemical: {technical: 0.30, fundamental: 0.50, commodity_news: 0.20}
    ferrous: {technical: 0.30, fundamental: 0.50, commodity_news: 0.20}
    nonferrous: {technical: 0.35, fundamental: 0.35, commodity_news: 0.30}
    agricultural: {technical: 0.20, fundamental: 0.45, commodity_news: 0.35}

dynamic_weights:
  # 根据 basis、市场确认质量、历史信号偏斜和 reviewer 写入的分析师绩效调整权重。
  # 时间维度差异：technical 偏短期，fundamental 偏中期，commodity_news 偏事件短窗。
  enabled: true
  min_weight: 0.05
  max_weight: 0.70

analyst_applicability_profile:
  # 分析师适用场景 profile。它不是手工交易规则，而是让权重计算尊重
  # “技术短期、基本面中期、新闻事件短窗”的能力边界。
  enabled: true
  technical:
    default_horizon: short
    horizon_multipliers: {short: 1.15, medium: 0.90, long: 0.75, event_short: 1.00}
    sector_multipliers: {energy: 1.00, chemical: 1.00, ferrous: 1.00, nonferrous: 1.00, agricultural: 0.95}
    market_regime_multipliers: {trending: 1.15, ranging: 0.90, reversal: 1.05}
  fundamental:
    default_horizon: medium
    horizon_multipliers: {short: 0.85, medium: 1.20, long: 1.10, event_short: 0.80}
    sector_multipliers: {energy: 1.00, chemical: 1.10, ferrous: 1.10, nonferrous: 1.00, agricultural: 1.05}
    market_regime_multipliers: {trending: 1.05, ranging: 1.10, reversal: 0.95}
  commodity_news:
    default_horizon: event_short
    event_window_days: 3
    outside_event_window_multiplier: 0.60
    horizon_multipliers: {short: 1.00, medium: 0.75, long: 0.60, event_short: 1.25}
    sector_multipliers: {energy: 1.05, chemical: 1.00, ferrous: 1.00, nonferrous: 1.05, agricultural: 1.15}
    market_regime_multipliers: {event_driven: 1.20, trending: 0.95, ranging: 0.90, reversal: 1.05}

# ---------------------------------------------------------------------------
# 5. Execution, Settlement, and Audit
# ---------------------------------------------------------------------------

execution:
  # Phase2 下单价格逻辑：执行基准价 +/- 滑点。
  slippage_model: tick
  default_slippage_ticks: 1

  intraday_confirmation:
    # 回测和模拟盘共用的盘中执行确认逻辑。
    # decision_frequency 是信号确认粒度；execution_frequency 是实际成交候选价粒度。
    enabled: true
    decision_frequency: "15m"
    execution_frequency: "1m"
    opening_range_minutes: 30
    require_complete_opening_range: true
    min_execution_volume: 1
    max_chase_ratio: 0.015
    finalize_after: "15:00:00"
    loop_check_interval_seconds: 300
    time_zone: null

  exit_policy:
    enabled: true
    defaults:
      atr_multiplier: 1.8
      probe_time_stop_days: 2
      trend_time_stop_days: 5
    sector_overrides:
      ferrous: {atr_multiplier: 2.2, probe_time_stop_days: 2, trend_time_stop_days: 7}
      agricultural: {atr_multiplier: 1.7, probe_time_stop_days: 2, trend_time_stop_days: 5}
      chemical: {atr_multiplier: 1.9, probe_time_stop_days: 2, trend_time_stop_days: 6}
      nonferrous: {atr_multiplier: 2.0, probe_time_stop_days: 2, trend_time_stop_days: 5}
    template_overrides:
      breakout_continuation: {atr_multiplier: 2.4, trend_time_stop_days: 8}
      low_position_reversal_confirmed: {atr_multiplier: 2.0, trend_time_stop_days: 6}
      news_event_probe: {atr_multiplier: 1.4, probe_time_stop_days: 1}

  slippage_ticks_by_underlying:
    AL: 1
    AU: 1
    BU: 1
    C: 1
    CF: 2
    CU: 1
    EB: 2
    HC: 1
    I: 1
    J: 1
    JM: 2
    M: 1
    MA: 1
    P: 1
    PB: 1
    RB: 1
    SC: 2
    SR: 1
    TA: 2
    ZN: 1

  commission:
    # mode=by_value 表示按成交额比例；mode=by_lot 表示按每手固定金额。
    enabled: true
    basis: execution_price
    rounding: 0.01
    require_explicit_rule_for_all_tickers: true
    by_underlying:
      AL: {mode: by_lot,   open: 3.0,     close: 3.0,     close_today: 3.0}
      AU: {mode: by_lot,   open: 10.0,    close: 10.0,    close_today: 10.0}
      BU: {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      C:  {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      CF: {mode: by_lot,   open: 4.3,     close: 4.3,     close_today: 4.3}
      CU: {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      EB: {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      HC: {mode: by_value, open: 0.00010, close: 0.00010, close_today: 0.00010}
      I:  {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      J:  {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      JM: {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      M:  {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      MA: {mode: by_value, open: 0.00010, close: 0.00010, close_today: 0.00010}
      P:  {mode: by_value, open: 0.00005, close: 0.00005, close_today: 0.00005}
      PB: {mode: by_value, open: 0.00004, close: 0.00004, close_today: 0.00004}
      RB: {mode: by_value, open: 0.00010, close: 0.00010, close_today: 0.00010}
      SC: {mode: by_lot,   open: 40.0,    close: 40.0,    close_today: 240.0}
      SR: {mode: by_lot,   open: 3.0,     close: 3.0,     close_today: 3.0}
      TA: {mode: by_lot,   open: 3.0,     close: 3.0,     close_today: 3.0}
      ZN: {mode: by_lot,   open: 3.0,     close: 3.0,     close_today: 3.0}

rollover:
  # 换月策略：同日策略目标与换月目标合并处理。
  mode: reconcile_with_strategy
  audit_execution_type: true

attribution:
  # 评估与归因工具配置。只读数据库，不参与交易。
  show_strategy_only_pairs: true
  show_rollover_summary: true

audit:
  # 审计日志配置，用于验证盘前决策的数据窗口和终端输出。
  log_technical_price_window: true

# ---------------------------------------------------------------------------
# 6. Universe, Agents, and LLM Routing
# ---------------------------------------------------------------------------

tickers:
  - BU
  - C
  - CF
  - EB
  - HC
  - I
  - J
  - M
  - MA
  - P
  - PB
  - RB
  - SR
  - TA
  - ZN

planner_mode: false
# planner_mode 是旧的 LLM 分析师选择器开关，只决定是否从 workflow_analysts 中挑选分析师。
# 当前交易计划审核由 trade_auditor 负责，因此这里保持 false。

workflow_analysts:
  - commodity_news
  - fundamental
  - technical

analyst_llm:
  # 所有分析师只调用云端主流 LLM；不再接入本地或自建专用模型。
  mode: cloud_only
  # null inherits llm.model; reports will show the active main model.
  # cloud_model: "gpt-5.5"
  # cloud_model: "deepseek-v4-flash"
  # cloud_model: "openai/gpt-5.5"
  cloud_model: null
  write_decision_reports: true
  force_neutral_low_tradeability: true
  cap_medium_tradeability_confidence: 0.65
  cap_low_tradeability_confidence: 0.35

llm:
  # Main LLM route. Switch provider/model here; portfolio_manager and analyst_llm inherit by default.
  # CodexOpenAI: third-party OpenAI-compatible gateway; env is loaded from project .env,
  # D:\research\AgentQuant.env, D:\research\Codex.env, or D:\research\Codex\AgentQuant.env.
  # DeepSeek: provider: "DeepSeek", model: "deepseek-v4-flash"
  # provider: "OpenRouter"
  # model: "openai/gpt-5.5"
  # structured_output_method: "json_mode"
  provider: "CodexOpenAI"
  model: "gpt-5.5"
  temperature: null
  structured_output_method: "json_mode"
  failure_policy:
    parse_error: "retry_then_default"
    rate_limit: "retry_with_backoff"
    auth_error: "raise"
    invalid_request: "raise"
    server_error: "retry_then_default"
  openrouter:
    app_name: "AgentQuant"
    reasoning:
      enabled: true
      effort: "medium"
      exclude: true
  codex_openai:
    base_url: "http://47.245.121.52"
  deepseek:
    thinking:
      enabled: false
    reasoning_effort: null
