# AgentQuant 期货回测、模拟盘与实盘复刻配置。
# 本文件只保留可运行参数；机制说明见 docs/mechanism_*.md。
# 硬约束、交易宇宙、数据源和 LLM 路由由本文件人工控制。
# 日度弱参和学习结果由 Researcher 写入数据库 overlay/state，不自动改写本文件。
# 最新业务主线：分析师定义品种化 state 与当前证据，Researcher 写带 usage_boundary 的
# open/hold/exit/execution action-value；分析师只读 signal_calibration，PM 只读开仓/持仓/退出
# 动作偏好，Trader 只读 execution profile。最终交易事实仍只认 PM 汇总出的
# final_action_contract，Trader 只执行该最终契约。
# 分析师输出里的“如果/等待/确认后才交易”属于 pending 条件，必须结构化为
# watch_for_trigger + trigger_valid=false。它不是即时交易授权；若同时具备
# setup_quality_ok、明确方向、entry_trigger 和 invalidation_present，PM 只能把它写入
# 同一张 final_action_contract 的条件监控 probe，Trader 只盘中检查触发，不能自创方向/手数。
# 只有当前触发已经成立且有失效边界时，才可进入 tradeable_candidate 或即时 probe/开仓候选。
# PM 还会把所有候选写入 opportunity_score / opportunity_rank / capital_allocation_reason：
# 这些字段驱动 PM 的全市场资金部署 pass，并回写同一张 final_action_contract；
# 它们不是第二张交易合约，也不给 Trader 新权限。Trader 仍只执行合约里的 target_lots/lots_delta。
# 被 PM 资金队列入选的 probe 仍按现有 probe 资金边界执行；未入选候选必须留下可复盘原因。
# 资金参数保护区：
#   - position_budget_policy
#   - risk_control
#   - net_exposure_control
#   - drawdown_control
#   - capital_utilization_control
# 未经明确要求，不要借配置整理、学习机制或门控优化修改这些参数值。
# 组合总保证金硬上限为 20%；真实新开仓最低保证金由 position_budget_policy 控制。
# 干净删库重跑前，建议先在 src 目录初始化主库和评估库。

# ---------------------------------------------------------------------------
# 0. Catalog 索引
# ---------------------------------------------------------------------------

config_catalogs:
  # 辅助 YAML 目录。运行时由 config_normalizer.py 展开成业务代码读取的配置形状。
  # 这里索引事实表、数据源、冷启动先验和策略边界；学习结果写数据库，不回写 YAML。
  execution_commission: execution_commission_catalog.yaml
  execution_slippage: execution_slippage_catalog.yaml
  execution_exit_policy: execution_exit_policy_catalog.yaml
  analyst_prior_profiles: analyst_prior_profiles.yaml
  portfolio_policy: portfolio_policy_catalog.yaml
  learning_policy: learning_policy_catalog.yaml
  data_factor_policy: data_factor_policy_catalog.yaml

# ---------------------------------------------------------------------------
# 1. 运行加速与数据预取
# ---------------------------------------------------------------------------

runtime:
  # 只加速工程流程，不改变交易策略、账务、学习写回或四阶段顺序。
  phase1:
    # 只并行 Phase1 分析师读数与 LLM 分析；PM 之后仍顺序执行。
    enable_analysis_parallelism: true
    max_parallel_analysis_tickers: 4
    prefetch_pre_open_reference_prices: true
    log_timing_breakdown: true
    # 主流程集中写 analyst signal，避免并行 worker 抢 SQLite 写锁。
    allow_parallel_analyst_db_writes: false
  data_cache:
    # 预取 PandaAI、Finoview、本地新闻，并复用进程内共享缓存。
    enabled: true
    prefetch_pandaai_market: true
    prefetch_pandaai_extra: true
    prefetch_finoview_feather: true
    prefetch_all_finoview_feathers: false
    prefetch_news_txt: true
  data_quality_summary:
    # 按交易日输出数据质量摘要，供复盘与学习检索。
    enabled: true
    output_dir: src/logs/data_quality

# ---------------------------------------------------------------------------
# 2. 控制组协议治理
# ---------------------------------------------------------------------------

control_governance:
  # 控制组只做多智能体协议、工具权限、成本与回测前健康审计。
  # 它不是 PM、Auditor、Trader 或 Researcher，也不是新的交易门控。
  # 任何 control_governance 输出都不能创建/否决交易权限，不能改 lots/margin_ratio。
  enabled: true
  protocol_governor:
    enabled: true
    role: audit_sidecar_only
    llm_enabled: false
    may_create_trade_authority: false
    may_modify_lots_or_margin: false
    may_execute_orders: false
    may_write_settlement: false
    final_trade_truth: final_action_contract
  preflight:
    enabled: true
    deterministic_only: true
    call_external_apis: false
    required_python_env: deepfund
    check_assets_writable: true
    check_local_sqlite: true
  cost_budget_audit:
    enabled: true
    role: resource_observation_only
    can_change_strategy: false
    can_emit_trade_action_fields: false
    allowed_outputs: [cost_report, cost_warning, retry_suggestion, investigation_priority]
  tool_access_policy:
    enabled: true
    role: agent_tool_namespace_audit
    violation_effect: protocol_error_only
    protocol_governor_allowed_namespaces: [control, database]

# ---------------------------------------------------------------------------
# 3. 实验、账户与资金硬边界
# ---------------------------------------------------------------------------

exp_name: "agentquant-futures-trading-2025"
cashflow: 5000000
market_type: "china_futures"

# 组合保证金绝对硬闸：所有交易合计最多占账户权益/本金 20%。
# 资金目标由 capital_utilization_control 管理，但不得突破此硬闸。
max_total_margin_ratio: 0.20

position_budget_policy:
  # 用户已调资金参数，属于核心保护区。
  # 所有学习、软门控和 alpha release 只能决定进入哪一层，不能自动改这些数值。
  # 仓位预算按“保证金占用”管理，而不是只看名义仓位比例。
  enabled: true
  basis: margin
  capital_base: account_equity
  hard_max_total_margin_ratio: 0.20
  # 500万本金下，真实开仓最低 0.8%=4万；与 probe 0.8%-1.5% 口径一致。
  min_real_trade_margin_ratio: 0.008
  min_real_trade_margin_abs: 40000
  apply_min_to_new_entries_only: true
  # 这里的 authority 指 final_action_contract 授权，不是第二张交易合约。
  require_final_trade_authority: true
  block_below_min_when_cannot_scale: true
  # 以下是冷启动资金分层。学习机制只校准进入哪一层，不突破 20% 硬上限。
  probe_margin_ratio: 0.008
  probe_margin_max_ratio: 0.015
  normal_trade_margin_ratio: 0.030
  normal_trade_margin_max_ratio: 0.060
  deployable_margin_ratio: 0.060
  deployable_margin_max_ratio: 0.120
  exceptional_margin_ratio: 0.075
  exceptional_margin_max_ratio: 0.130
  max_single_ticker_margin_ratio: 0.130

analyst_weight_policy:
  # 该配置块只表达“分析师冷启动先验”。
  # 它只辅助中期背景、冷启动排序和适用性解释；最终开仓/加仓权限必须来自
  # PM 的 action evidence router，不能由静态权重直接生成。
  enabled: true
  mode: evidence_router
  static_weights_mode: prior_only
  static_weights_can_create_trade_authority: false
  allow_static_weights_to_open: false
  strategic_profile: sector_strategic_view
  trade_timing_profile: daily_trade_timing
  dynamic_overlay: database_only
  # 方向观点不能开仓；watch_for_trigger 本身不能开仓。
  # 干净的条件机会只能由 PM 写入 final_action_contract 条件监控合约后交给 Trader 盘中检查。
  strategic_view_cannot_open_position: true
  watch_for_trigger_cannot_open_position: true

risk_control:
  # 用户已调资金参数，属于核心保护区。
  # 按账户权益 / 初始资金划分风险状态。
  warning_ratio: 0.70
  danger_ratio: 0.50
  emergency_ratio: 0.30

  # 风险状态下对目标仓位的缩放。
  position_scaling:
    safe: 1.0
    warning: 0.6
    danger: 0.3

  # 单机会初始敞口锚，不是单品种硬上限。
  max_single_position_ratio:
    safe: 0.15
    warning: 0.08
    danger: 0.05

net_exposure_control:
  # 用户已调资金参数，属于核心保护区。
  # 限制组合多空净方向暴露。
  max_net_exposure: 0.50
  # 仅已验证强机会可临时使用更高净敞口。
  strong_opportunity_max_net_exposure: 2.00
  symmetric_scaling: true

# ---------------------------------------------------------------------------
# 4. 数据配置索引
# ---------------------------------------------------------------------------

# 数据入口与质量策略由 data_factor_policy_catalog.yaml 展开：
#   fundamental_quality_control / pandaai_extra_data / factor_data。
# 市场确认策略由 portfolio_policy_catalog.yaml 展开：
#   market_confirmation。

# ---------------------------------------------------------------------------
# 5. 审计、回撤与学习频率控制
# ---------------------------------------------------------------------------


# 审计、交易频率、品种表现和短期亏损控制由 portfolio_policy_catalog.yaml 展开：
#   trade_auditor / trade_frequency_control / ticker_performance_control / ticker_loss_control。

drawdown_control:
  # 用户已调资金参数，属于核心保护区。
  # 账户回撤分层控制：警戒压缩风险，硬保护进入冷静与恢复试探。
  enabled: true
  # 账户级最大回撤预算：7% 警戒压缩，10% 硬保护；不改变 20% 总保证金上限。
  warning_drawdown: 0.07
  hard_drawdown: 0.10
  warning_cap_multiplier: 0.60
  warning_target_margin_ratio_max: 0.04
  initial_hard_cooldown_days: 1
  first_probe_loss_cooldown_days: 2
  second_probe_loss_cooldown_days: 3
  cooldown_increment_days: 1
  recovery_probe_margin_ratio_min: 0.008
  recovery_probe_margin_ratio_max: 0.015
  recovery_restore_step_margin_ratios: [0.02, 0.04, 0.06, 0.08]
  recovery_probe_min_confirmation_score: 0.65
  recovery_probe_min_confirmations: 3
  recovery_probe_require_stop_protection: true
  recovery_probe_block_weak_memory: true

# ---------------------------------------------------------------------------
# 6. 资金利用与 PM 运行策略
# ---------------------------------------------------------------------------

# 学习、记忆、Neutral 追责和保留周期由 learning_policy_catalog.yaml 展开：
#   strategy_memory / learning / analyst_business_quality / llm_signal_quality / learning_context / learning_retention。

capital_utilization_control:
  # 用户已调资金参数，属于核心保护区。
  # 资金目标按保证金比例计算；只向高质量机会释放，不用弱信号硬凑仓位。
  enabled: true
  target_margin_ratio_min: 0.08
  target_margin_ratio_max: 0.12
  target_margin_ratio_confirmed: 0.10
  strong_opportunity_target_margin_ratio_min: 0.16
  strong_opportunity_target_margin_ratio_max: 0.20
  strong_opportunity_target_margin_ratio_confirmed: 0.18
  max_margin_ratio_after_scaling: 0.20
  # 前置软风险标签先进入 PM 统一仲裁：弱证据不能被资金利用率硬凑仓位；
  # 但同作用域高质量学习证据 + 当日确认 + 止损/失效边界达标时，仍可继续 alpha release。
  respect_pre_control_soft_limits: true
  # 资金补足只释放给确认度合格的方向；0.60 与市场确认弱模板门槛保持一致。
  min_confirmation_score_for_scaling: 0.60
  lookback_trades_for_scaling: 12
  # 以下最近表现阈值仅在 scale_only_when_recent_pnl_positive=true 时启用。
  min_completed_trades_for_scaling: 0
  min_recent_win_rate_for_scaling: 0.50
  min_recent_total_pnl_for_scaling: 0
  scale_only_when_recent_pnl_positive: false
  # protected/allow 可解除部分软 cap，但仍需市场确认和硬风控。
  allow_memory_protected_scaling: true
  allow_recovering_template_scaling: false
  # protected 不降低当天 market confirmation 门槛。
  memory_protected_min_confirmation_score: 0.60
  # 强扩仓不能只依赖泛化记忆。
  protected_min_sample_count_for_scaling: 5
  protected_min_win_rate_for_scaling: 0.60
  protected_min_net_pnl_for_scaling: 1000
  require_specific_signal_combo_for_strong_scaling: true
  # 强机会扩仓必须有止损或失效边界。
  require_stop_protection_for_strong_scaling: true
  block_scaling_on_conflicting_weak_memory: true
  # 动态机会预算：在 20% 总上限内按证据质量分配容量。
  dynamic_concentration_enabled: true
  other_opportunity_reserve_fraction_of_tradable_capital: 0.15
  unverified_probe_fraction_of_remaining_capacity: 0.12
  validated_min_fraction_of_remaining_capacity: 0.25
  validated_max_fraction_of_remaining_capacity: 0.65
  confirmation_allocation_power: 1.75
  stop_protection_allocation_bonus: 0.15
  # 极强机会层：仅成熟样本、强确认和止损边界同时达标时触发。
  exceptional_validated_enabled: true
  exceptional_validated_requires_stop_protection: true
  exceptional_validated_min_confirmation_score: 0.85
  exceptional_validated_min_sample_count: 8
  exceptional_validated_min_win_rate: 0.70
  exceptional_validated_min_net_pnl: 5000
  exceptional_other_opportunity_reserve_fraction_of_tradable_capital: 0.05
  exceptional_validated_min_fraction_of_remaining_capacity: 0.75
  exceptional_validated_max_fraction_of_remaining_capacity: 0.95
  exceptional_confirmation_allocation_power: 1.00
  allow_probe_above_observation_target: true
  # 名义仓位上限只作配置回退；运行时仓位事实仍以 final_action_contract 和保证金预算为准。
  strong_opportunity_max_position_ratio_multiplier: 20.0
  strong_opportunity_max_position_ratio_cap: 2.00
  allow_confirmed_same_side_add_on: true
  same_side_add_on_match_tolerance: 0.0005

# PM 主策略、方向覆盖策略和动态先验边界由 portfolio_policy_catalog.yaml 展开：
#   directional_override_control / portfolio_manager / dynamic_weights。

# ---------------------------------------------------------------------------
# 7. 执行与结算
# ---------------------------------------------------------------------------

execution:
  # 手续费、滑点和退场冷启动策略由 execution_*_catalog.yaml 展开。

  limit_lock:
    # 只用已知涨跌停字段做成交保护，避免未来信息污染。
    enabled: true
    tolerance_ticks: 0

  dynamic_margin:
    # 优先 PandaAI 合约保证金率，失败回退本地静态缓存。
    enabled: true
    provider: pandaai
    fallback_to_static_contract_cache: true

  contract_expiry_guard:
    # 临近交割阻止新开仓；平仓、减仓和换约不受阻断。
    enabled: true
    block_new_entries_in_delivery_month: true
    near_expiry_days_before_delivery_month: 5
    near_expiry_days_before_last_trade: 5
    apply_to_rollover: false

  intraday_confirmation:
    # 回测和模拟盘共用的盘中执行确认逻辑。
    enabled: true
    decision_frequency: "15m"
    execution_frequency: "1m"
    opening_range_minutes: 30
    require_complete_opening_range: true
    min_execution_volume: 1
    max_chase_ratio: 0.015
    # 成熟记忆且市场确认强时，允许 VWAP fallback。
    allow_confirmed_memory_vwap_fallback: true
    confirmed_memory_min_market_confirmation_score: 0.70
    confirmed_memory_min_confirmations: 3
    # 候选假设和小样本泛化记忆不能触发 fallback。
    confirmed_memory_min_sample_count: 5
    confirmed_memory_min_win_rate: 0.60
    confirmed_memory_min_net_pnl: 1000
    confirmed_memory_max_opening_range_miss: 0.002
    finalize_after: "15:00:00"
    loop_check_interval_seconds: 300
    time_zone: null

rollover:
  # 换月策略：同日策略目标与换月目标合并处理。
  mode: reconcile_with_strategy

audit:
  # 审计日志配置，用于验证盘前决策的数据窗口和终端输出。
  log_technical_price_window: true

# ---------------------------------------------------------------------------
# 8. 交易宇宙、智能体与 LLM 路由
# ---------------------------------------------------------------------------

tickers:
  - BU
  - C
  - CF
  - EB
  - HC
  - I
  - J
  - M
  - MA
  - P
  - PB
  - RB
  - SR
  - TA
  - ZN

planner_mode: false
# 规划器开关；当前保持 false，真实回测使用 workflow_analysts。

workflow_analysts:
  - commodity_news
  - fundamental
  - technical

analyst_llm:
  # 分析师默认继承主模型。
  mode: cloud_only
  # null 表示继承 llm.model。
  # cloud_model: "claude-opus-4-6-1"
  cloud_model: null
  write_decision_reports: true
  force_neutral_low_tradeability: false
  cap_medium_tradeability_confidence: 0.75
  cap_low_tradeability_confidence: 0.45
  # 基本面严重陈旧时只能中性追责，不包装成方向锚。
  force_neutral_stale_fundamental: true
  stale_fundamental_stale_ratio: 0.35
  stale_fundamental_freshness_score: 0.45
  cap_stale_fundamental_confidence: 0.30

llm:
  # 主 LLM 路由。只通过注释/取消注释 provider/model 两行切换网关与模型。
  # 不要把 API key 写入配置文件。
  #
  # ===== 当前启用：CodexOpenAI 网关 / GPT-5.5 / medium reasoning =====
  provider: "CodexOpenAI"
  model: "gpt-5.5"
  #
  # ===== 备用停用：TQXAI 网关 / claude-opus-4-6-1 =====
  # TQXAI 调用说明见 D:\research\LLM\api_test_report.md、D:\research\LLM\api_test.py、D:\research\LLM\API.txt。
  # 如需切回 TQXAI，只注释上面两行，并取消注释下面两行：
  # provider: "TQXAI"
  # model: "claude-opus-4-6-1"

  temperature: null
  # 控制 LLM 并发数；不跳过、不降级、不改变 prompt。
  max_concurrent_calls: 4
  structured_output_method: "json_mode"
  failure_policy:
    parse_error: "retry_then_default"
    rate_limit: "retry_with_backoff"
    auth_error: "raise"
    invalid_request: "raise"
    server_error: "retry_then_default"

  # ===== CodexOpenAI 网关配置块：当前启用 =====
  # API key 在 D:\research\AgentQuant\.env 的 CODEX_OPENAI_API_KEY。
  # 网关地址来自当前 AgentQuant .env 与配置共识：不要改成 D:\research\Codex 旧示例里的地址。
  codex_openai:
    base_url: "http://47.74.0.65"
    reasoning_effort: "medium"
    api_key_env: "CODEX_OPENAI_API_KEY"
    api_key_env_fallbacks: []

  # ===== TQXAI 网关配置块：完整保留，当前停用 =====
  # API key 在 D:\research\AgentQuant\.env 的 TQX_LLM_API_KEY。
  # claude-opus-4-6-1 支持 TQXAI OpenAI-compatible chat，但不接受 OpenAI reasoning_effort。
  # 如需切回 TQXAI，取消注释 provider/model 两行和下面整个 tqxai 配置块。
  # tqxai:
  #   base_url: "https://llm.tqx.ai"
  #   reasoning_effort: null
  #   api_key_env: "TQX_LLM_API_KEY"
  #   api_key_env_fallbacks: []



