# AgentQuant 主配置
# 本文件只负责运行入口、catalog 索引、账户/资金参数、交易宇宙和 LLM 路由。
# 机制说明见 docs/mechanism_*.md；字段语义见 docs/matrix_field_semantics.md；
# 策略细节、学习策略、数据策略和 rank 权重由 config_catalogs 指向的 catalog 展开。
#
# 硬边界：
# - 交易动作只能来自 PM 签出的 final_action_contract。
# - 学习结果写入数据库 overlay/state，不自动改写本 YAML。
# - 本文件不硬编码具体品种好坏、方向偏好或回测学习结果。
# - 只区分账户硬边界和 PM 计划预算，不把计划预算漂移当日终 hard fail。

# ---------------------------------------------------------------------------
# 0. Catalog 索引：主配置只挂载目录，不在这里展开策略细节
# ---------------------------------------------------------------------------

config_catalogs:
  execution_commission: execution_commission_catalog.yaml
  execution_slippage: execution_slippage_catalog.yaml
  execution_exit_policy: execution_exit_policy_catalog.yaml
  analyst_prior_profiles: analyst_prior_profiles.yaml
  portfolio_policy: portfolio_policy_catalog.yaml
  learning_policy: learning_policy_catalog.yaml
  rank_score_policy: rank_score_policy.yaml
  data_factor_policy: data_factor_policy_catalog.yaml
  product_price_behavior_profiles: product_price_behavior_profiles.yaml

# ---------------------------------------------------------------------------
# 1. 运行加速与数据预取：只影响性能和数据准备，不改变交易权限
# ---------------------------------------------------------------------------

runtime:
  phase1:
    enable_analysis_parallelism: true
    max_parallel_analysis_tickers: 4
    prefetch_pre_open_reference_prices: true
  data_cache:
    enabled: true
    prefetch_pandaai_market: true
    prefetch_pandaai_extra: true
    prefetch_finoview_feather: true
    prefetch_all_finoview_feathers: false
    prefetch_news_txt: true

# ---------------------------------------------------------------------------
# 2. 控制组协议治理：PG 只做回测前就绪检测和每日物理结果检测，不生成交易事实
# ---------------------------------------------------------------------------

control_governance:
  protocol_governor:
    may_create_trade_authority: false
    may_modify_lots_or_margin: false
    may_execute_orders: false

# ---------------------------------------------------------------------------
# 3. 实验账户与资金控制
# ---------------------------------------------------------------------------

# 3.1 实验账户基础
exp_name: "agentquant-futures-trading-2025"
cashflow: 5000000
market_type: "china_futures"

# 3.2 账户/组合保证金硬边界
# 账户/组合保证金硬边界：真实账户保证金占用不得突破。
# 这是 Phase4 可 hard fail 的账户硬线，不是 PM 资金层级目标。
max_total_margin_ratio: 0.20

# 3.3 PM Step5 资金部署预算和签约约束
# 该段服务 PM 计划、rank 资金部署和 Step6 签约；不由 Reviewer/PG 复判收益表现。
position_budget_policy:
  enabled: true
  # 账户/组合保证金硬边界：PM 签约、Auditor 复核、Trader 执行与 Reviewer 结算验收都必须守住。
  hard_max_total_margin_ratio: 0.20
  min_real_trade_margin_ratio: 0.008
  min_real_trade_margin_abs: 40000
  apply_min_to_new_entries_only: true
  require_final_trade_authority: true
  block_below_min_when_cannot_scale: true
  # PM Step5 计划预算/资金层级参数：决定 probe/normal/deployable/exceptional 的计划保证金层级。
  # 真实成交后因条件腿未触发、成交子集、价格变化或滑点导致偏离时，只进入 Reviewer
  # budget_drift_diagnostics / warning / factual attribution / Researcher input，不作为 Phase4 或 PG 日终 hard fail。
  probe_margin_ratio: 0.008
  probe_margin_max_ratio: 0.015
  normal_trade_margin_ratio: 0.030
  normal_trade_margin_max_ratio: 0.060
  deployable_margin_ratio: 0.060
  deployable_margin_max_ratio: 0.120
  exceptional_margin_ratio: 0.075
  exceptional_margin_max_ratio: 0.130
  # PM 签约/资金部署阶段的单品种资金硬约束；Reviewer/PG 不用它复判日终策略违规或收益表现。
  max_single_ticker_margin_ratio: 0.130

# 3.4 分析师证据权重入口
# 该段只作为 PM 证据路由/先验设置；分析师仍不能生成手数、保证金或 final_action_contract。
analyst_weight_policy:
  mode: evidence_router
  static_weights_mode: prior_only
  static_weights_can_create_trade_authority: false
  strategic_profile: sector_strategic_view
  trade_timing_profile: daily_trade_timing
  strategic_view_cannot_open_position: true
  watch_for_trigger_cannot_open_position: true

# 3.5 账户风险状态与软降级比例
# 该段用于 PM/Auditor/Trader 风险状态识别和降级，不创建新交易权限。
risk_control:
  warning_ratio: 0.70
  danger_ratio: 0.50
  emergency_ratio: 0.30

  position_scaling:
    safe: 1.0
    warning: 0.6
    danger: 0.3

  max_single_position_ratio:
    safe: 0.15
    warning: 0.08
    danger: 0.05

# 3.6 PM Step5 净敞口计划预算
# 该段用于组合计划净敞口和强机会预算释放；真实执行后的偏离只进入复盘归因。
net_exposure_control:
  # PM Step5 净敞口计划预算和强机会释放参数。
  # 实际执行路径偏离计划净敞口时，Reviewer 只做预算漂移事实归因，不把它当日终交易违规。
  max_net_exposure: 0.50
  strong_opportunity_max_net_exposure: 2.00
  symmetric_scaling: true

# ---------------------------------------------------------------------------
# 4. 数据配置入口：真实数据策略由 catalog 展开
# ---------------------------------------------------------------------------

# 数据、市场确认、商品画像、证据融合和 PM 策略细节由 config_catalogs 对应 catalog 展开。

# ---------------------------------------------------------------------------
# 5. 回撤、冷却与恢复期预算
# ---------------------------------------------------------------------------

# 回撤状态用于风险降级、冷却和恢复期计划预算；不生成交易事实。
drawdown_control:
  enabled: true
  warning_drawdown: 0.07
  hard_drawdown: 0.10
  warning_cap_multiplier: 0.60
  # PM 计划预算/恢复期资金层级参数；真实执行后偏离只进入复盘归因，不作为日终 hard fail。
  warning_target_margin_ratio_max: 0.04
  initial_hard_cooldown_days: 1
  first_probe_loss_cooldown_days: 2
  second_probe_loss_cooldown_days: 3
  cooldown_increment_days: 1
  recovery_probe_margin_ratio_max: 0.015
  recovery_restore_step_margin_ratios: [0.02, 0.04, 0.06, 0.08]
  recovery_probe_min_confirmation_score: 0.65
  recovery_probe_min_confirmations: 3
  recovery_probe_require_stop_protection: true
  recovery_probe_block_weak_memory: true

# ---------------------------------------------------------------------------
# 6. PM 资金利用目标与强机会释放
# ---------------------------------------------------------------------------

# 策略性资金部署、学习、排名和触发质量规则由 portfolio/learning catalog 展开。
# 以下 target/strong/max-scaling 参数用于 PM Step5 计划预算、rank/部署和资金利用目标。
# 真实成交后的预算漂移只进入 Reviewer budget_drift_diagnostics、warning、事实归因和 Researcher input。

capital_utilization_control:
  enabled: true
  target_margin_ratio_min: 0.08
  target_margin_ratio_max: 0.12
  target_margin_ratio_confirmed: 0.10
  strong_opportunity_target_margin_ratio_min: 0.16
  strong_opportunity_target_margin_ratio_max: 0.20
  strong_opportunity_target_margin_ratio_confirmed: 0.18
  max_margin_ratio_after_scaling: 0.20
  respect_pre_control_soft_limits: true
  min_confirmation_score_for_scaling: 0.60
  lookback_trades_for_scaling: 12
  min_completed_trades_for_scaling: 0
  min_recent_win_rate_for_scaling: 0.50
  min_recent_total_pnl_for_scaling: 0
  scale_only_when_recent_pnl_positive: false
  allow_memory_protected_scaling: true
  allow_recovering_template_scaling: false
  memory_protected_min_confirmation_score: 0.60
  protected_min_sample_count_for_scaling: 5
  protected_min_win_rate_for_scaling: 0.60
  protected_min_net_pnl_for_scaling: 1000
  require_specific_signal_combo_for_strong_scaling: true
  require_stop_protection_for_strong_scaling: true
  block_scaling_on_conflicting_weak_memory: true
  dynamic_concentration_enabled: true
  other_opportunity_reserve_fraction_of_tradable_capital: 0.15
  unverified_probe_fraction_of_remaining_capacity: 0.12
  validated_min_fraction_of_remaining_capacity: 0.25
  validated_max_fraction_of_remaining_capacity: 0.65
  confirmation_allocation_power: 1.75
  stop_protection_allocation_bonus: 0.15
  exceptional_validated_enabled: true
  exceptional_validated_requires_stop_protection: true
  exceptional_validated_min_confirmation_score: 0.85
  exceptional_validated_min_sample_count: 8
  exceptional_validated_min_win_rate: 0.70
  exceptional_validated_min_net_pnl: 5000
  exceptional_other_opportunity_reserve_fraction_of_tradable_capital: 0.05
  exceptional_validated_min_fraction_of_remaining_capacity: 0.75
  exceptional_validated_max_fraction_of_remaining_capacity: 0.95
  exceptional_confirmation_allocation_power: 1.00
  allow_probe_above_observation_target: true
  strong_opportunity_max_position_ratio_multiplier: 20.0
  strong_opportunity_max_position_ratio_cap: 2.00
  allow_confirmed_same_side_add_on: true
  same_side_add_on_match_tolerance: 0.0005

# ---------------------------------------------------------------------------
# 7. 执行、保证金、换约与审计日志
# ---------------------------------------------------------------------------

# 执行层只消费审计通过的 final_action_contract；不能改 PM 目标手数或方向。
execution:
  limit_lock:
    enabled: true
    tolerance_ticks: 0

  dynamic_margin:
    enabled: true
    provider: pandaai
    fallback_to_static_contract_cache: true

  contract_expiry_guard:
    enabled: true
    block_new_entries_in_delivery_month: true
    near_expiry_days_before_delivery_month: 5
    near_expiry_days_before_last_trade: 5
    apply_to_rollover: false

  intraday_confirmation:
    enabled: true
    decision_frequency: "15m"
    execution_frequency: "1m"
    opening_range_minutes: 30
    require_complete_opening_range: true
    min_execution_volume: 1
    max_chase_ratio: 0.015
    finalize_after: "15:00:00"
    loop_check_interval_seconds: 300
    time_zone: null

rollover:
  mode: reconcile_with_strategy

# ---------------------------------------------------------------------------
# 8. 交易宇宙、启用分析师与 LLM 路由
# ---------------------------------------------------------------------------

# 8.1 交易宇宙
tickers:
  - BU
  - C
  - CF
  - EB
  - HC
  - I
  - J
  - M
  - MA
  - P
  - PB
  - RB
  - SR
  - TA
  - ZN

# 8.2 工作流模式
# planner 当前封存，false 是唯一合法运行口径。
planner_mode: false

# 8.3 启用分析师
workflow_analysts:
  - commodity_news
  - fundamental
  - technical

# 8.4 分析师 LLM 输出后处理边界
# 分析师可用 LLM 形成结构化证据，但不能输出手数、保证金或 final_action_contract。
analyst_llm:
  write_decision_reports: true
  force_neutral_low_tradeability: false
  cap_medium_tradeability_confidence: 0.75
  cap_low_tradeability_confidence: 0.45
  force_neutral_stale_fundamental: true
  stale_fundamental_stale_ratio: 0.35
  stale_fundamental_freshness_score: 0.45
  cap_stale_fundamental_confidence: 0.30

# 8.5 LLM 模型切换
# 始终只启用一个完整的 llm 配置块；切换模型时，整块注释当前配置，再整块取消注释目标配置。

# LLM GPT（当前启用）
llm:
  provider: "CodexOpenAI"
  model: "gpt-5.6-sol"
  temperature: null
  max_concurrent_calls: 4
  structured_output_method: "json_mode"
  failure_policy:
    parse_error: "retry_then_raise"
    rate_limit: "retry_with_backoff"
    auth_error: "raise"
    invalid_request: "raise"
    server_error: "retry_with_backoff"

  codex_openai:
    reasoning_effort: "medium"

